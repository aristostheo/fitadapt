name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run pytest --cov=fitadapt --cov-branch --cov-report=term-missing --cov-fail-under=95
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python -c "from fitadapt.api.app import app; print(app.title, app.version)"
      - run: uv build
