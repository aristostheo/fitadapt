name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run pytest tests/integration/api/test_somata_bridge_api.py
      - run: uv run pytest --cov=fitadapt --cov-branch --cov-report=term-missing --cov-fail-under=95
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python -c "from fitadapt.api.app import app; print(app.title, app.version)"
      - run: uv build
      - name: Verify release artifacts contain only the Python service
        run: |
          python - <<'PY'
          import tarfile
          import zipfile
          from pathlib import Path

          sdist = next(Path("dist").glob("fitadapt-*.tar.gz"))
          wheel = next(Path("dist").glob("fitadapt-*.whl"))
          with tarfile.open(sdist) as archive:
              names = [member.name for member in archive.getmembers() if member.isfile()]
              assert any(name.endswith("/src/fitadapt/api/app.py") for name in names)
              assert not any("/web/" in name or "/data/" in name or "/.env" in name for name in names)
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              assert "fitadapt/api/app.py" in names
              assert not any("/web/" in name or "/data/" in name or "/.env" in name for name in names)
          PY
  production-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Assemble minimal production build context
        run: |
          context="$RUNNER_TEMP/fitadapt-production-context"
          mkdir -p "$context/src"
          cp Dockerfile .dockerignore pyproject.toml uv.lock README.md "$context/"
          cp -R src/fitadapt "$context/src/"
          test -z "$(find "$context" -type f -name '.env*' -print -quit)"
      - name: Build production image locally
        run: docker build --pull --tag fitadapt:checkpoint9 "$RUNNER_TEMP/fitadapt-production-context"
      - name: Inspect image and smoke-test running container
        run: python3 tests/container_smoke.py --image fitadapt:checkpoint9
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run lint
      - working-directory: web
        run: npm run test -- --run
      - working-directory: web
        run: npm run build
